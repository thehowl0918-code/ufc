<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옥타곤 로드 — 무명에서 UFC 챔피언까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#E4E7EC;--bg2:#D6DAE1;--panel:#FFFFFF;--panel2:#F0F2F6;--line:#CBD1DB;--ink:#10141C;--muted:#5A6476;
  --red:#C8102E;--red2:#8F0A20;--blue:#1F4FBF;--blue2:#112E78;--gold:#A8840F;--good:#1C8A4B;--bad:#C8102E;
  --sel:#C8102E;--selink:#fff;
  --sh:0 1px 0 rgba(16,20,28,.05),0 14px 30px -20px rgba(16,20,28,.5);
  --fh:'Black Han Sans','Noto Sans KR',sans-serif;
  --fd:'Barlow Condensed','Noto Sans KR','Arial Narrow',sans-serif;
  --fb:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0C11;--bg2:#10141B;--panel:#141922;--panel2:#1B212C;--line:#283041;--ink:#EAEDF3;--muted:#8E98AA;
  --red:#E3243B;--red2:#7D0718;--blue:#3B6FF0;--blue2:#14307A;--gold:#E1B23A;--good:#3DBB72;--bad:#F0475B;
  --sh:0 1px 0 rgba(0,0,0,.35),0 16px 34px -18px rgba(0,0,0,.85);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0C11;--bg2:#10141B;--panel:#141922;--panel2:#1B212C;--line:#283041;--ink:#EAEDF3;--muted:#8E98AA;
  --red:#E3243B;--red2:#7D0718;--blue:#3B6FF0;--blue2:#14307A;--gold:#E1B23A;--good:#3DBB72;--bad:#F0475B;
  --sh:0 1px 0 rgba(0,0,0,.35),0 16px 34px -18px rgba(0,0,0,.85);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 600px at 105% -10%,color-mix(in srgb,var(--blue) 16%,transparent),transparent 70%),
  radial-gradient(1000px 600px at -5% 110%,color-mix(in srgb,var(--red) 14%,transparent),transparent 70%)}
#app{position:relative;z-index:1}
button,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.1;font-weight:400}
.muted{color:var(--muted)}.small{font-size:13px}
.gain{color:var(--good);font-weight:700}.warn{color:var(--bad);font-weight:700}
kbd{font-family:var(--fd);font-weight:700;font-size:13px;line-height:1;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 6px;white-space:nowrap;display:inline-block;min-width:1.7em;text-align:center;color:var(--ink)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus{outline:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 공통 버튼: 포커스가 곧 선택 */
.btn{appearance:none;border:1px solid var(--line);border-radius:6px;padding:11px 18px;background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .12s,color .12s,border-color .12s,transform .12s}
.btn:hover,.btn:focus-visible{background:var(--sel);color:var(--selink);border-color:var(--sel);outline:none}
.btn:focus-visible kbd,.btn:hover kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.btn.primary:focus-visible{box-shadow:0 0 0 3px var(--gold);background:var(--red)}
.btn.big{font-family:var(--fh);font-weight:400;font-size:22px;padding:15px 22px;letter-spacing:.02em}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--red)}

/* 타이틀 */
.ts{min-height:100vh;display:grid;grid-template-rows:1fr auto;overflow:hidden;position:relative}
.ts-oct{position:absolute;right:-12vmin;top:50%;transform:translateY(-50%);width:92vmin;height:92vmin;opacity:.09;color:var(--ink)}
.ts-light{position:absolute;inset:-20% -10% auto;height:120%;background:conic-gradient(from 180deg at 50% -10%,transparent 168deg,color-mix(in srgb,#fff 14%,transparent) 180deg,transparent 192deg);animation:sweep 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes sweep{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.ts-in{position:relative;max-width:1180px;width:100%;margin:0 auto;padding:7vh 28px 0;display:flex;flex-direction:column;justify-content:center}
.ts-k{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--muted);font-size:14px}
.ts-k i{width:34px;height:4px;background:var(--red)}
.ts-k i+i{background:var(--blue)}
.ts h1{font-family:var(--fh);font-size:clamp(64px,11vw,148px);line-height:.95;margin:14px 0 6px;letter-spacing:-.01em}
.ts h1 span{display:block;color:transparent;-webkit-text-stroke:2px var(--ink)}
.ts-sub{font-size:18px;color:var(--muted);max-width:44ch;margin:0 0 34px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.slots{grid-template-columns:1fr}}
.slot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:190px;box-shadow:var(--sh);overflow:hidden}
.slot.empty{background:color-mix(in srgb,var(--panel) 55%,transparent);border-style:dashed;box-shadow:none}
.slot .no{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--muted)}
.slot h3{font-family:var(--fh);font-size:30px}
.slot .rec{font-family:var(--fd);font-weight:800;font-size:34px;line-height:1}
.slot .ovr{position:absolute;right:-6px;top:-6px;background:var(--red);color:#fff;font-family:var(--fd);font-weight:800;font-size:34px;padding:12px 18px 6px 22px;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
.slot .acts{margin-top:auto;display:flex;gap:8px;padding-top:10px}
.slot .acts .btn{flex:1}
.slot .acts .btn.del{flex:none;padding:11px 12px}
.foot{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding:14px 20px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 70%,transparent)}
.foot span{display:inline-flex;gap:6px;align-items:center}

/* 생성 */
.page{max-width:1180px;margin:0 auto;padding:26px 24px 40px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-h h2{font-family:var(--fh);font-size:48px}
.cgrid{display:grid;grid-template-columns:430px 1fr;gap:18px}
@media (max-width:980px){.cgrid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--sh)}
.ch{font-family:var(--fh);font-size:24px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ch::before{content:"";width:6px;height:22px;background:var(--red);transform:skewX(-14deg)}
.ch .r{margin-left:auto;font-family:var(--fd);font-size:18px;color:var(--muted)}
.field{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;border:1px solid transparent;cursor:pointer;margin:2px 0}
.field .fl{color:var(--muted);font-size:13.5px;font-weight:700}
.field .fv{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px}
.field .fv b{font-family:var(--fd);font-size:24px;color:var(--muted);width:34px;text-align:center;border-radius:5px;cursor:pointer;user-select:none}
.field .fv b:hover{background:rgba(255,255,255,.18)}
.field:focus-visible,.field:hover{background:var(--sel);color:#fff;outline:none}
.field:focus-visible .fl,.field:hover .fl,.field:focus-visible .fv b,.field:hover .fv b{color:rgba(255,255,255,.8)}
.field.locked{opacity:.5}
.field input{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-weight:700;width:100%}
.field input:focus{border-color:var(--gold);outline:none}
.field:focus-within:has(input){background:var(--panel2);color:inherit}

/* 허브 */
.shell{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr auto;min-height:100vh}
.top{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.top .ovr{background:linear-gradient(160deg,var(--red),var(--red2));color:#fff;padding:12px 44px 10px 26px;clip-path:polygon(0 0,100% 0,84% 100%,0 100%);display:flex;flex-direction:column;justify-content:center;align-items:center}
.top .ovr b{font-family:var(--fd);font-weight:800;font-size:56px;line-height:.9}
.top .ovr span{font-size:11px;opacity:.85}
.top .who{padding:12px 6px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.top .who h2{font-family:var(--fh);font-size:34px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
.chip.gold{color:#fff;background:var(--gold);border-color:var(--gold)}
.chip.good{color:#fff;background:var(--good);border-color:var(--good)}
.top .side{display:flex;align-items:stretch}
.top .stat{padding:10px 20px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);text-align:right}
.top .stat b{font-family:var(--fd);font-weight:800;font-size:34px;line-height:1}
.top .next{background:var(--ink);color:var(--bg);padding:10px 22px;display:flex;flex-direction:column;justify-content:center;min-width:220px}
.top .next .meta{color:inherit;opacity:.7}
.top .next b{font-family:var(--fh);font-size:22px;font-weight:400}
.top .next.now{background:linear-gradient(90deg,var(--red),var(--red2));color:#fff}
@media (max-width:1100px){.top{grid-template-columns:auto 1fr}.top .side{grid-column:1/-1;border-top:1px solid var(--line)}.top .stat:first-child{border-left:0}}
.nav{padding:18px 0 18px 14px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 50%,transparent)}
.nav button{appearance:none;background:none;border:0;text-align:left;padding:12px 16px 12px 14px;border-radius:6px 0 0 6px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;color:var(--muted);cursor:pointer;position:relative}
.nav button kbd{margin-left:auto;opacity:.7}
.nav button[aria-current="true"]{color:var(--ink);background:var(--panel)}
.nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;background:var(--red);border-radius:2px}
.nav button:focus-visible,.nav button:hover{background:var(--sel);color:#fff;outline:none}
.nav button:focus-visible kbd{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4)}
.nav .sep{flex:1}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (max-width:820px){.shell{grid-template-columns:1fr}.nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav button{border-radius:6px}.nav .sep{display:none}}
.stage{padding:20px 24px 34px;min-width:0}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.sh h2{font-family:var(--fh);font-size:38px}
.sh p{margin:0;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.even{grid-template-columns:1fr 1fr}
@media (max-width:1100px){.cols,.cols.even{grid-template-columns:1fr}}
.stack>*+*{margin-top:14px}
.shell>.foot{grid-column:1/-1}

/* 능력치 */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
@media (max-width:640px){.sgrid{grid-template-columns:1fr}}
.sg h4{margin:10px 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.sg h4 i{width:10px;height:10px;transform:skewX(-14deg)}
.sg h4 span{margin-left:auto;font-family:var(--fd);font-size:18px}
.st{display:grid;grid-template-columns:94px 1fr 30px;gap:10px;align-items:center;font-size:13.5px;margin:5px 0}
.bar{position:relative;height:9px;background:var(--panel2);border-radius:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.st .v{font-family:var(--fd);font-weight:800;font-size:19px;text-align:right}

/* 재능 */
.tal{border-left:5px solid;padding:9px 12px;background:var(--panel2);border-radius:0 8px 8px 0;margin:7px 0}
.tal .g{font-family:var(--fd);font-weight:800;font-size:14px;letter-spacing:.04em}
.tal .n{font-weight:900}
.tal .d{font-size:13px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.reveal .tal{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.reveal .tal:nth-of-type(2){animation-delay:.18s}.reveal .tal:nth-of-type(3){animation-delay:.36s}

/* 훈련 */
.intens{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.intens .btn{flex:1;min-width:110px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tc{appearance:none;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);transition:transform .12s,border-color .12s,box-shadow .12s;position:relative;overflow:hidden}
.tc .h{display:flex;align-items:center;gap:10px}
.tc .h strong{flex:1;font-size:16px}
.tc .mono{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:#fff;font-family:var(--fh);font-size:17px;flex:none}
.tc .s{font-size:12.5px;color:var(--muted)}
.tc .f{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.tc:focus-visible,.tc:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 0 0 2px var(--red),var(--sh);outline:none}
.tc:focus-visible::after{content:"";position:absolute;right:-16px;top:-16px;width:40px;height:40px;background:var(--red);transform:rotate(45deg)}
.tc:disabled{opacity:.4;cursor:not-allowed}
.meter{height:10px;background:var(--panel2);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%}
.prev .row{display:grid;grid-template-columns:92px 1fr 64px;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.prev .bar i.add{background:var(--good);opacity:.85}
.log{max-height:240px;overflow:auto;font-size:13px}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.result{border-left:5px solid var(--good)}

/* 기술 */
.tech{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--panel);cursor:default}
.tech .n{font-weight:900}
.tech .d{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.tech .req{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
.tech .req span{display:inline-flex;gap:6px;align-items:center}
.tech .req .bar{width:90px}
.tech:focus-visible{border-color:var(--red);box-shadow:0 0 0 2px var(--red);outline:none}
.tech.on{border-left:5px solid var(--good)}
.tech.off{border-left:5px solid var(--line)}
.lv{font-family:var(--fd);font-weight:800;color:var(--gold)}

/* 테일 오브 테이프 */
.tape{border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh)}
.tape .hd{display:grid;grid-template-columns:1fr auto 1fr;color:#fff}
.tape .hd>div{padding:14px 16px}
.tape .hd .r{background:linear-gradient(160deg,var(--red),var(--red2))}
.tape .hd .b{background:linear-gradient(200deg,var(--blue),var(--blue2));text-align:right}
.tape .hd .vs{background:#0c0f14;display:grid;place-items:center;font-family:var(--fh);font-size:22px;padding:0 14px}
.tape .hd h3{font-family:var(--fh);font-size:26px}
.tape table{width:100%;border-collapse:collapse;background:var(--panel)}
.tape td{padding:6px 14px;border-top:1px solid var(--line);font-size:14px}
.tape td:first-child{text-align:left;font-family:var(--fd);font-size:19px;font-weight:700;width:38%}
.tape td:nth-child(2){text-align:center;color:var(--muted);font-size:12.5px}
.tape td:last-child{text-align:right;font-family:var(--fd);font-size:19px;font-weight:700;width:38%}
.tape .adv{color:var(--good)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts .btn{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:10px 12px}
.opts .btn small{font-weight:500;font-size:12px;opacity:.8}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;align-items:center}
.keys>span:nth-child(odd){display:flex;gap:3px}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
table.hist th,table.hist td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
table.hist th{font-size:12px;color:var(--muted);font-weight:700}
.W{color:var(--good);font-weight:900}.L{color:var(--bad);font-weight:900}.D{color:var(--muted);font-weight:900}
.big{font-family:var(--fd);font-weight:800;font-size:44px;line-height:1}
.notice{border-left:5px solid var(--gold);background:var(--panel);padding:12px 16px;border-radius:0 8px 8px 0;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

/* 딜레이 */
#busy{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(4px);animation:fadein .15s ease-out}
#busy .bz{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 28px 20px;min-width:min(380px,86vw);box-shadow:var(--sh);position:relative;overflow:hidden}
#busy .bz::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--red),var(--blue))}
#busy .bzl{font-family:var(--fh);font-size:30px}
#busy .bzs{min-height:1.6em;color:var(--muted);font-size:15px;margin-top:2px}
#busy .bzb{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:14px}
#busy .bzb i{display:block;height:100%;width:0;background:var(--red);transition-property:width;transition-timing-function:linear}
@keyframes fadein{from{opacity:0}}

/* 전투 */
.fw{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;background:#05070a}
#fightWrap{position:relative;width:min(100%,calc((100vh - 130px)*1.6));aspect-ratio:16/10}
#cv{cursor:crosshair;touch-action:none}
.ctl{width:min(100%,calc((100vh - 130px)*1.6));display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;user-select:none;-webkit-user-select:none;touch-action:none}
.ctl .pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px}
.ctl .pad .up{grid-column:2;grid-row:1}.ctl .pad .left{grid-column:1;grid-row:2}.ctl .pad .down{grid-column:2;grid-row:2}.ctl .pad .right{grid-column:3;grid-row:2}
.ctl .acts{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.ctl .sys{display:flex;gap:6px}
.cb{appearance:none;background:#161b24;border:1px solid #2e3747;border-radius:8px;color:#e8ecf2;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;min-height:44px;touch-action:none}
.cb.mv{padding:0;font-size:16px}
.cb.act{flex-direction:column;gap:2px;min-width:78px;padding:6px 10px}
.cb.act span{font-size:14px}
.cb kbd{background:#252c38;border-color:#3b4555;color:#9aa4b4;font-size:11px;padding:2px 5px}
.cb:hover:not(:disabled){border-color:#e3243b}
.cb.on{background:#e3243b;border-color:#e3243b;color:#fff}
.cb:disabled{opacity:.25;cursor:default}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:8px}
#gl{background:#07090c}
#fov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,10,.74);border-radius:8px;color:#fff;z-index:3}
#fov .box{background:#141922;border:1px solid #2c3546;border-radius:10px;padding:22px 26px;max-width:600px;width:92%;position:relative;overflow:hidden}
#fov .box::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,#e3243b,#3b6ff0)}
#fov h2{font-family:var(--fh);font-size:42px;margin-bottom:6px}
#fov table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
#fov td{padding:4px 6px;border-bottom:1px solid #2a3240}
#fov td:first-child{color:#ff6b7a;font-family:var(--fd);font-size:19px;font-weight:700}
#fov td:nth-child(2){color:#9aa4b4;text-align:center}
#fov td:last-child{color:#7fa6ff;font-family:var(--fd);font-size:19px;font-weight:700;text-align:right}
#fov .tip{color:#e8d38a;font-size:14px;margin:8px 0}
#fov .doc{color:#ff9aa5;font-size:14px;margin:6px 0}
#fov kbd{background:#252c38;border-color:#3b4555;color:#fff}
#fov .btn{background:#1d2430;border-color:#323c4e;color:#fff}
#fov .btn:focus-visible,#fov .btn:hover{background:#e3243b;border-color:#e3243b}

/* 결과 */
.rb{display:grid;grid-template-columns:1fr auto 1fr;border-radius:12px;overflow:hidden;box-shadow:var(--sh);margin-bottom:16px;color:#fff}
.rb>div{padding:20px 24px}
.rb .r{background:linear-gradient(160deg,var(--red),var(--red2))}
.rb .b{background:linear-gradient(200deg,var(--blue),var(--blue2));text-align:right}
.rb .m{background:#0c0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 40px}
.rb .m b{font-family:var(--fh);font-size:64px;font-weight:400;line-height:1}
.rb h2{font-family:var(--fh);font-size:34px}
@media (max-width:760px){.rb{grid-template-columns:1fr}.rb .b{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function rollGrade(sc){const w=sc?[55-9*sc,26+3*sc,12+3.5*sc,5+1.8*sc,2+.7*sc]:GW,s=w.reduce((a,b)=>a+b,0);let r=Math.random()*s;for(let i=0;i<5;i++){r-=w[i];if(r<=0)return i}return 0}
function rollTalents(sc,extra){
 const rv=Math.random(),vis=(rv<.5?1:rv<.88?2:3)+(extra||0);
 const rh=Math.random(),hid=rh<.4?1:rh<.65?2:rh<.75?3:0;
 const ids=TALENTS.map(t=>t.id).sort(()=>Math.random()-.5);
 const out=[];
 for(let i=0;i<vis+hid;i++)out.push({id:ids[i],g:rollGrade(sc),hidden:i>=vis});
 return out;
}
function talEff(t){return TAL[t.id].e(GR[t.g].m)}
function calcMods(f){
 const m={...MOD0};
 for(const t of f.talents||[]){if(t.hidden)continue;const e=talEff(t);for(const k in e)if(k in MOD0&&typeof e[k]==='number')m[k]+=e[k]}
 m.taken=Math.min(m.taken,.35);
 if(f.leg)m.techReq+=(f.leg.tech||0)*2;
 return m;
}
function growMul(f,k){
 let g=1;
 for(const t of f.talents){if(t.hidden)continue;const e=talEff(t);
  if(e.grow&&e.grow[k])g+=e.grow[k];
  if(e.growCat&&e.growCat[SCAT[k]])g+=e.growCat[SCAT[k]];
  if(e.train)g+=e.train;}
 return g;
}
function applyTalentBase(f,t,initial){
 const e=talEff(t);
 if(e.capAll)for(const k of SK)f.caps[k]=Math.min(99,f.caps[k]+e.capAll);
 if(e.cap)for(const k in e.cap)f.caps[k]=Math.min(99,f.caps[k]+e.cap[k]);
 if(initial&&e.allStat)for(const k of SK)f.stats[k]=Math.max(8,f.stats[k]+e.allStat);
 if(e.stat)for(const k in e.stat)f.stats[k]=Math.min(f.caps[k],f.stats[k]+e.stat[k]);
 if(e.reachCm)f.reach+=Math.round(e.reachCm);
}
function ageMul(a,res){const m=a<=22?1.2:a<=26?1.1:a<=30?1:a<=33?.8:.6;return m<1?Math.min(1,m+(res||0)):m}
function curStyle(f){
 const s=f.stats,st=(s.punch+s.kick+s.sspeed+s.acc)/4,gr=(s.td+s.wrestle+s.bjj+s.subatk)/4;
 if(gr-st>6)return s.bjj+s.subatk>s.td+s.wrestle?'주짓수':'레슬러';
 if(st-gr>6)return s.kick>s.punch+3?'킥복서':'복서';
 return '올라운더';
}

function ovr(f){return Math.round(SK.reduce((a,k)=>a+f.stats[k],0)/SK.length)}

const SKINS=['#f0cdb0','#e2b08e','#c99068','#a87048','#7d4e30','#563322'],HAIRS=['#15100c','#2a1c12','#4a321f','#7b5832','#a8834d','#0d0d0d'];
const DEFLOOK={skin:'#c99068',hair:'#2a1c12',hairStyle:0,beard:false};
function rollLook(){return {skin:pick(SKINS),hair:pick(HAIRS),hairStyle:ri(0,2),beard:Math.random()<.35}}
function wcOf(w){const i=WC.findIndex(x=>w<=x[1]);return i<0?WC.length-1:i}
function rollBody(){const w=Math.round((52+Math.pow(Math.random(),1.3)*60)*10)/10,h=Math.round(clamp(157+(w-55)*.55+rnd(-6,7),157,206)),rc=Math.round(h+rnd(-5,10));return {weight:w,height:h,reach:rc,wc:wcOf(w)}}
function bulkOf(f){const h=(f.height||180)/100,w=f.weight||(WC[f.wc]?WC[f.wc][1]-1:75);return clamp(w/(h*h)/23.5,.85,1.28)}
function migrate(f){if(!f)return;if(!f.weight)f.weight=WC[f.wc][1]-1;if(!f.look)f.look=rollLook();if(f.opp)migrate(f.opp)}
function rollFighterBase(o){
 const tilt=STY[o.style]||{};
 const ageAdj=o.age<=22?-4:o.age>=30?5:0, capAdj=o.age<=22?4:o.age>=30?-5:0;
 const stats={},caps={};
 for(const k of SK){
  const t=tilt[k]||0;
  stats[k]=clamp(rnd(28,44)+t*.8+ageAdj,10,70);
  caps[k]=clamp(rnd(60,88)+(t>0?t*.5:0)+capAdj,stats[k]+10,97);
 }
 const body=rollBody();
 const f={name:o.name,nation:o.nation,age:o.age,...body,look:rollLook(),style0:o.style,stats,caps,talents:rollTalents(lv('scout'),lv('slot'))};
 for(const k of SK){f.caps[k]=Math.min(99,f.caps[k]+lv('cap')*2);f.stats[k]=Math.min(f.caps[k],f.stats[k]+lv('gym')*2)}
 for(const t of f.talents)if(!t.hidden)applyTalentBase(f,t,true);
 return f;
}

function genOpp(tier,wc){

 const stats={};for(const k of SK)stats[k]=clamp(lvl+(tilt[k]||0)+rnd(-7,7),12,96);

 o.weight=Math.round((WC[wc][1]-rnd(0,4))*10)/10;o.height=Math.round(clamp(WC[wc][2]+rnd(-6,6),157,206));o.reach=o.height+ri(-3,10);o.look=rollLook();

const Store={db:null,uid:null,chain:Promise.resolve(),
 async init(){
  try{
   if(!window.claude||typeof claude.use!=='function')return;
   const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
   if(!db||!user)return;
   const id=await user.id();if(!id)return;
   this.db=db;this.uid=id;
   if(UI.screen==='title')renderTitle();
  }catch(e){}
 },
 lk(s){return 'octagon-road-slot-'+s},
 localGet(s){try{const v=localStorage.getItem(this.lk(s));return v?JSON.parse(v):null}catch(e){return null}},
 localSet(s,d){try{localStorage.setItem(this.lk(s),JSON.stringify(d));return true}catch(e){return false}},
 ref(s){return this.db.doc('data/users/'+this.uid+'/slot'+s)},
 async get(s){
  const l=this.localGet(s);let r=null;
  if(this.db){try{const snap=await this.ref(s).get();if(snap.exists){const d=snap.data();r=d&&d.json?JSON.parse(d.json):null}}catch(e){}}
  if(l&&r)return (r.savedAt||0)>(l.savedAt||0)?r:l;
  return r||l;
 },
 set(s,d){
  d.savedAt=Date.now();
  const ok=this.localSet(s,d);
  if(this.db){const json=JSON.stringify(d),at=d.savedAt;this.chain=this.chain.then(()=>this.ref(s).set({json,savedAt:at})).catch(()=>{})}
  return ok||!!this.db;
 },
 async del(s){try{localStorage.removeItem(this.lk(s))}catch(e){} if(this.db){try{await this.ref(s).delete()}catch(e){}}}
};

function focusables(){return [...document.querySelectorAll('#app button:not(:disabled), #app [data-nav], #app input')].filter(el=>el.offsetParent!==null&&!el.closest('[hidden]'))}
function focusDefault(){const d=document.querySelector('#app [data-default]:not(:disabled)')||focusables()[0];if(d)d.focus({preventScroll:false})}
function navMove(dir){
 const els=focusables(),cur=document.activeElement;
 if(!els.includes(cur)){focusDefault();return}
 const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let best=null,bd=1e9;
 for(const el of els){if(el===cur)continue;const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;let p,s;
  if(dir==='up'){if(dy>-4||q.bottom>r.top+4)continue;p=-dy;s=Math.abs(dx)}
  else if(dir==='down'){if(dy<4||q.top<r.bottom-4)continue;p=dy;s=Math.abs(dx)}
  else if(dir==='left'){if(dx>-4||q.right>r.left+4)continue;p=-dx;s=Math.abs(dy)}
  else{if(dx<4||q.left<r.right-4)continue;p=dx;s=Math.abs(dy)}
  const sc=p+s*2.2;if(sc<bd){bd=sc;best=el}}
 if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest'})}
}

 const dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
 if(e.key==='Escape'){e.preventDefault();if(typing){const els=focusables(),i=els.indexOf(a);a.blur();(els[i+1]||els[0]).focus();return}goBack();return}
 if(dirs[e.key]){
  if(typing&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  if(a&&a.dataset&&a.dataset.step&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();stepField(a.dataset.step,e.key==='ArrowLeft'?-1:1);return}
  e.preventDefault();navMove(dirs[e.key]);return;
 }
 if(typing){if(e.key==='Enter'){e.preventDefault();navMove('down')}return}
 if(e.key==='Enter'){
  if(a&&a.tagName==='BUTTON')return;
  if(a&&a.dataset&&a.dataset.step){e.preventDefault();stepField(a.dataset.step,1);return}
  e.preventDefault();focusDefault();return;
 }
 if(e.repeat)return;
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 const el=[...document.querySelectorAll('#app [data-key]')].find(x=>x.dataset.key===k&&!x.disabled);
 if(el){e.preventDefault();el.focus();el.click()}
});

function trainPreview(id){

 if(id==='rest'){box.innerHTML=`<div class="ch">휴식</div><p class="muted" style="margin:0 0 8px">얼음 찜질과 숙면으로 몸을 회복합니다.</p>${condHTML(f)}`;return}

 box.innerHTML=`<div class="ch">${T.n} <span class="r">${it.n}</span></div><p class="muted small" style="margin:0 0 6px">${TDESC[id]}</p>
  ${Object.keys(T.w).sort((a,b)=>T.w[b]-T.w[a]).map(k=>{const v=f.stats[k],g=expGain(f,k,T.w[k],it.m)*m;
   return `<div class="row"><span>${SN[k]}</span><div class="bar"><i style="width:${v}%;background:var(--ink);opacity:.55"></i><i class="add" style="left:${v}%;width:${g}%"></i><b style="left:${f.caps[k]}%"></b></div><span class="small" style="text-align:right">${Math.floor(v)} <span class="gain">+${g.toFixed(1)}</span></span></div>`}).join('')}
  <p class="small" style="margin:10px 0 0">부상 위험 <b class="${trainRisk(f,id,f.injury?0:UI.int)>=.08?'warn':''}">${(trainRisk(f,id,f.injury?0:UI.int)*100).toFixed(1)}%</b> · 피로 +${Math.round(it.fat*(1.1-f.stats.recov/400))} (현재 ${Math.round(f.fatigue)})</p>`;
}
function trainMsgHTML(m){
 return `<div class="card result"><div class="ch">${esc(m.title)}</div>
  ${m.gains.length?`<p style="margin:4px 0">${m.gains.map(([k,v])=>`<span class="gain">${SN[k]} +${v.toFixed(1)}</span>`).join(' · ')}</p>`:''}
  ${m.notes.map(n=>`<p style="margin:4px 0" class="${n.bad?'warn':n.big?'gain':''}">${esc(n.t)}</p>`).join('')}</div>`;
}
function trainGain(f,k,w,im){return expGain(f,k,w,im)*rnd(.8,1.2)}
function addStat(f,k,amt){const v=f.stats[k],cap=f.caps[k];if(v>=cap||amt<=0)return 0;const g=Math.min(amt*growMul(f,k),cap-v);f.stats[k]+=g;return g}
function injure(f,w){const name=pick(INJ);if(f.injury){f.injury.weeks+=w}else f.injury={name,weeks:w};return f.injury}
function injureNamed(f,name,w){if(f.injury){f.injury.weeks+=w;f.injury.name=name}else f.injury={name,weeks:w};return f.injury}
function tryDiscover(f,chance){
 const hid=f.talents.filter(t=>t.hidden);if(!hid.length)return null;
 if(Math.random()<chance+calcMods(f).discover+(f.leg?f.leg.disc*.05:0)){const t=pick(hid);t.hidden=false;applyTalentBase(f,t,false);return t}
 return null;
}
function newTechs(before,f){const m=calcMods(f),now=TECH.filter(t=>techOK(f.stats,m,t.id)).map(t=>t.n).concat(SUBS.filter(s=>f.stats.subatk>=s.req-m.techReq).map(s=>s.n+' 공격'));return now.filter(x=>!before.includes(x))}
function techSnapshot(f){const m=calcMods(f);return TECH.filter(t=>techOK(f.stats,m,t.id)).map(t=>t.n).concat(SUBS.filter(s=>f.stats.subatk>=s.req-m.techReq).map(s=>s.n+' 공격'))}
function endWeek(f,notes,rest){
 f.week++;
 const rec=f.stats.recov,fr=(1+calcMods(f).fatigueRec)*(1+.15*(f.leg?f.leg.rec:0));
 if(!rest)f.fatigue=Math.max(0,f.fatigue-5*(.7+rec/150)*fr);
 if(f.injury){f.injury.weeks-=rest?2:1;if(f.injury.weeks<=0){notes.push({t:`${f.injury.name}에서 회복했다.`});f.injury=null}}
 if(f.week%52===0){f.age++;notes.push({t:`한 살을 더 먹었다. (${f.age}세)`});if(f.age>=RETIRE_AGE)f.retired=true}
 f.nextFightIn--;
 if(f.nextFightIn===0)notes.push({t:`경기 주간이 됐다. 상대는 ${f.opp.name}.`,big:1});
}
function doTrain(id){
 const f=G.f;if(f.nextFightIn<=0)return;
 const T=TRAIN[id],ii=f.injury?0:UI.int,it=INT[ii];
 busy(`${T.n} 훈련 중`,1050,()=>{
  const notes=[],gains=[],before=techSnapshot(f),mul=trainMul(f,id)*(f.injury?.6:1);
  for(const k in T.w){const g=trainGain(f,k,T.w[k],it.m)*mul;if(g>0.05){f.stats[k]=Math.min(f.caps[k],f.stats[k]+g);gains.push([k,g])}}
  const ch=trainRisk(f,id,ii);
  f.fatigue=clamp(f.fatigue+it.fat*(1.1-f.stats.recov/400),0,100);
  if(Math.random()<ch){const j=injure(f,ri(1,3)+(ii===2?1:0));notes.push({t:`훈련 중 부상: ${j.name} (${j.weeks}주)`,bad:1})}
  const t=tryDiscover(f,T.disc||.025);
  if(t)notes.push({t:`숨겨진 재능 발견! [${GR[t.g].n}] ${TAL[t.id].n}`,big:1});
  for(const n of newTechs(before,f))notes.push({t:`새 기술 습득: ${n}`,big:1});
  if(!gains.length)notes.push({t:'이 훈련으로 더 늘어날 능력치가 없다. 성장 한계에 가깝다.'});
  const title=`${T.n} (${it.n}) 완료`;
  endWeek(f,notes,false);
  f.log.unshift({w:f.week,t:`${title}${gains.length?' — '+gains.map(([k,v])=>SN[k]+' +'+v.toFixed(1)).join(', '):''}${notes.length?' / '+notes.map(n=>n.t).join(' / '):''}`});
  f.log=f.log.slice(0,60);
  UI.trainMsg={title,gains,notes};save();if(f.retired){retire();return}refresh();
 },cycle(FLAV[id]));
}
function doRest(){
 const f=G.f;if(f.nextFightIn<=0)return;
 busy('휴식 중',800,()=>{
  const before=f.fatigue;f.fatigue=Math.max(0,f.fatigue-30*(.7+f.stats.recov/150)*(1+calcMods(f).fatigueRec)*(1+.15*(f.leg?f.leg.rec:0)));
  const notes=[{t:`피로도 ${Math.round(before)} → ${Math.round(f.fatigue)}`}];
  endWeek(f,notes,true);
  f.log.unshift({w:f.week,t:'휴식 — '+notes.map(n=>n.t).join(' / ')});
  UI.trainMsg={title:'휴식 완료',gains:[],notes};save();if(f.retired){retire();return}refresh();
 },cycle(['얼음 찜질','스트레칭','푹 잔다']));
}

function windupT(f,M){
 const sp=M.type==='kick'?(S(f,'sspeed')+S(f,'spd'))/2:M.type==='td'?(S(f,'spd')+S(f,'td'))/2:S(f,'sspeed');
 let t=M.wu*(1.22-sp/250)*(1-f.mods.windup)*(f.st<25?1.25:1)*(M===MOVES.jab?1-f.mods.jabSpeed:1);
 if(!f.isP)t*=1+FT.F[0].mods.read;
 if(FT.zone&&FT.zone.side===idx(f))t*=.6;
 return t;
}
function gainMom(f,v){f.mom=Math.min(100,f.mom+v*(1+f.mods.momGain))}
function fx(x,y,t,c,size){FT.fx.push({x,y,t,c:c||'#fff',life:1,s:size||18})}
function msg(t,dur,c,size){FT.msgs.push({t,life:dur||1.2,max:dur||1.2,c:c||'#fff',s:size||40})}
function spark(x,y,c){for(let i=0;i<7;i++)FT.fx.push({x,y,vx:rnd(-160,160),vy:rnd(-160,160),life:.35,c,dot:1})}
const INJT={cut:{n:'눈 위 출혈',d:'공격 명중 각도가 줄어든다',after:'눈 위 열상'},ribs:{n:'갈비뼈 손상',d:'스태미나 소모가 늘고 회복이 줄어든다',after:'갈비뼈 손상'},
 leg:{n:'다리 부상',d:'이동·회피 속도와 킥 위력이 줄어든다',after:'다리 타박상'},arm:{n:'팔 부상',d:'펀치 위력과 서브미션 공격이 줄어든다',after:'팔꿈치 염좌'}};
const INJLV=['','경미한','심한','심각한'];
const ARMSUBS=['암바','키무라','오모플라타'];
function hurt(f,type,p){
 if(!FT||FT.over||f.inj[type]>=3)return false;
 p*=(1.25-S(f,'chin')/100)*(1-f.mods.taken)*Math.max(.1,1-(f.mods['inj'+type[0].toUpperCase()+type.slice(1)]||0));
 if(Math.random()>=p)return false;
 f.inj[type]++;
 msg(`${f.isP?'부상!':'상대 부상!'} ${INJLV[f.inj[type]]} ${INJT[type].n}`,1.7,f.isP?'#ff6b6b':'#ffd23c',28);
 fx(f.x,f.y-50,INJT[type].n,'#ff5566',16);
 if(type==='cut'&&f.inj.cut>=3&&Math.random()<.5){msg('닥터 스톱',1.6,'#fff',40);finish(other(f),'TKO','닥터 스톱 (출혈)')}
 return true;
}

function startMove(f,key){
 if(f.state!=='idle'||!key)return false;
 const M=MOVES[key];
 if(M.special&&f.mom<100){if(f.isP)fx(f.x,f.y-40,'모멘텀 부족','#aaa',15);return false}
 if(M.type==='zone'){if(FT.zone)return false;f.mom=0;const d=M.dur*(1+(S(f,'focus')-62)/120);FT.zone={side:idx(f),t:d,max:d};
  msg(f.isP?'더 존':'상대가 존에 들어갔다',1.3,f.isP?'#7fd4ff':'#ff8a95',f.isP?60:34);return true}
 const cost=M.st*costMul(f);
 if(f.st<cost*.5){if(f.isP)fx(f.x,f.y-40,'스태미나 부족','#aaa',15);return false}
 if(M.special){f.mom=0;if(f.isP)msg(M.n+'!',.8,'#ff5566',34)}
 f.st=Math.max(0,f.st-cost);f.guard=false;f.move=key;f.moveId++;f.state='windup';f.t=windupT(f,M);f.hitDone=false;f.whiff=false;
 if(M.type!=='td')FT.rs[idx(f)].thrown++;
 if(f.isP)notePattern(key);
 return true;
}
function dodge(f,dx,dy){
 const okState=f.state==='idle'||(f.state==='recover'&&f.t<.12);
 if(!okState||f.dodgeCd>0)return false;
 const cost=9*costMul(f);if(f.st<cost)return false;
 const n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;
 const sp=430*(.8+S(f,'spd')/250)*(1-.1*f.inj.leg);
 f.st-=cost;f.state='dodge';f.t=.17;f.dvx=dx*sp;f.dvy=dy*sp;f.move=null;f.guard=false;
 f.iframe=(.12+S(f,'evade')/700)*(1+f.mods.reflex);f.dodgeCd=.45;f.dodgeT0=FT.clock;
 return true;
}
function playerAction(a){
 const P=FT.F[0];if(FT.mode!=='stand')return;
 if(P.state==='down'||P.state==='stun')return;
 if(a==='dodge'){
  let [dx,dy]=moveVec(P);
  if(!dx&&!dy){dx=-Math.cos(P.ang);dy=-Math.sin(P.ang)}
  dodge(P,dx,dy);return;
 }
 const key=a==='sp'?specialFor(P):a;
 if(!key){fx(P.x,P.y-40,'익힌 필살기가 없다','#aaa',15);return}
 if(P.state==='idle')startMove(P,key);
 else if(P.state==='recover'||P.state==='active')P.buf={k:key,t:.22};
}
function notePattern(k){
 const ai=FT.ai,A=FT.F[1];if(MOVES[k].special)return;
 FT.pat.push(k);if(FT.pat.length>6)FT.pat.shift();
 const cnt={};for(const x of FT.pat)cnt[x]=(cnt[x]||0)+1;
 let best=null,bc=0;for(const x in cnt)if(cnt[x]>bc){bc=cnt[x];best=x}
 const th=A.mods.read>0||S(A,'judge')>65?3:4;
 const nr=FT.pat.length>=4&&bc>=th?best:null;
 if(nr&&nr!==ai.readType)msg(`상대가 당신의 ${MOVES[nr].n} 패턴을 읽었다`,1.8,'#8fb6ff',26);
 ai.readType=nr;
}

/* ========================= 전투: 타격 판정 ========================= */
function calcDmg(a,b,M){
 const pow=M.type==='kick'?S(a,'kick'):S(a,'punch');
 let d=M.dmg*(.55+pow/110)*(.85+S(a,'str')/400)*(1+a.mods.dmg+(M.type==='kick'?a.mods.kickDmg:a.mods.punchDmg)+a.planDmg);
 if(a.st<25)d*=.78;
 d*=M.type==='kick'?1-.15*a.inj.leg:1-.12*a.inj.arm;
 if(a.hp<a.hpMax*.35)d*=1-.18*(1-S(a,'calm')/120)*(1-Math.min(.9,a.mods.steel));
 if(FT.round===ROUNDS||a.hp<a.hpMax*.35)d*=1+a.mods.clutch;
 if(FT.round===1)d*=1+a.mods.round1;
 d*=(1.15-S(b,'chin')/250)*(1-b.mods.taken)*rnd(.9,1.1)*.72;
 return d;
}
function tryHit(a,b){
 const M=MOVES[a.move];if(b.state==='down')return;
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
 if(d>M.rg*rangeMul(a)+b.R)return;
 const ad=Math.abs(angN(Math.atan2(dy,dx)-a.ang));
 if(ad>M.arc*(.85+S(a,'acc')/300)*(1+a.mods.arc)*(1-.1*a.inj.cut))return;
 a.hitDone=true;
 const rs=FT.rs[idx(a)];
 if(b.iframe>0){
  if(FT.clock-b.dodgeT0<.13&&techOK(b.stats,b.mods,'slip')){fx(b.x,b.y-40,'슬립 카운터!','#9fe8ff',20);b.counterWin=1.1;b.st=Math.min(100,b.st+6);gainMom(b,14)}
  else{fx(b.x,b.y-40,'회피!','#9fe8ff');b.counterWin=.7;gainMom(b,10)}
  return}
 if(M.type==='td'){resolveTD(a,b,M);return}
 if(!b.guard&&Math.random()<S(b,'evade')/100*.12*(b.state==='idle'?1:.35)){fx(b.x,b.y-40,'슬립','#9fe8ff',15);return}
 let dmg=calcDmg(a,b,M);
 if(d>(M.rg*rangeMul(a)+b.R)*.8)dmg*=1+a.mods.sniper;
 const counter=(['windup','active','recover'].includes(b.state)&&b.move&&MOVES[b.move].type!=='td')||a.counterWin>0;
 const facing=Math.abs(angN(Math.atan2(a.y-b.y,a.x-b.x)-b.ang))<1.3;
 const blocked=b.guard&&facing;
 if(blocked){
  const chk=techOK(b.stats,b.mods,'check');
  dmg*=(M.type==='kick'?(chk?.25:.6):.28)*(1.15-S(b,'sdef')/250);
  if(M.type==='kick'&&chk)fx(b.x,b.y-58,'킥 체크','#9fe8ff',15);
  b.st=Math.max(0,b.st-M.st*.7*(1.2-S(b,'sdef')/200));
  fx(b.x,b.y-40,'블록','#bbb',15);
  if(b.st<=0){b.guard=false;b.state='stun';b.t=.45;b.move=null;fx(b.x,b.y-60,'가드 붕괴!','#ffb347',20)}
  gainMom(a,2);
  if(M.type==='kick'&&!chk)hurt(b,'arm',.06);
 }else{
  if(counter){dmg*=1.35+a.mods.counter;fx(b.x,b.y-58,'카운터!','#ffd23c',22);a.counterWin=0}
  a.chain=FT.clock-a.lastHit<.9?Math.min(3,a.chain+1):0;a.lastHit=FT.clock;
  if(a.chain&&a.mods.combo){dmg*=1+a.mods.combo*a.chain;if(a.chain>=2)fx(a.x,a.y-46,a.chain+1+'연타','#ffd23c',15)}
  if(a.mods.bodyShot)b.st=Math.max(0,b.st-dmg*a.mods.bodyShot*8);
  rs.landed++;if(M.type==='kick')rs.kickL++;
  if(M.multi){dmg*=M.multi;fx(b.x,b.y-72,M.multi+'연타!','#ffd23c',20)}
  if(M.drain){b.st=Math.max(0,b.st-M.drain);fx(b.x,b.y-72,'간 타격!','#ffd23c',20)}
  if(M.heavy||counter){b.state='stun';b.t=M.stunT||(counter?.35:.2);b.move=null;b.guard=false;b.buf=null}
  const n=d||1;b.x+=dx/n*(M.heavy?14:6);b.y+=dy/n*(M.heavy?14:6);
  gainMom(a,counter?16:M.heavy?10:6);
  FT.shake=Math.max(FT.shake,M.heavy?(M.special?10:6):2);
  spark(b.x-dx/n*14,b.y-dy/n*14,M.heavy?'#ffb347':'#fff');
  if(M.heavy||counter)FT.hs=Math.max(FT.hs,M.special?.1:.055);
 }
 b.hp-=dmg;b.flash=.12;rs.dmg+=dmg;
 if(!blocked){if(M.type==='punch'&&(M.heavy||counter))hurt(b,'cut',dmg/110);else if(M.type==='kick')hurt(b,Math.random()<.5?'ribs':'leg',dmg/100)}
 fx(b.x+rnd(-8,8),b.y-24,Math.round(dmg)+'',blocked?'#888':'#ff6b6b',14);
 if(b.hp<=0&&!FT.over){if(blocked){b.hp=1;return}zeroHP(a,b,M)}
}
function zeroHP(a,b,M){
 const chin=S(b,'chin');
 if(b.mods.survive>0&&!b.survived){b.survived=true;b.hp=b.hpMax*Math.max(.1,b.mods.survive);b.state='stun';b.t=.5;msg(b.isP?'버텼다! 불굴의 투지':'상대가 버텼다!',1.4,'#ffd23c',34);return}
 if(b.kd>=2){finish(a,'TKO','연속 다운');return}
 if(b.kd>=1&&(M.heavy||Math.random()<.5)){finish(a,M.heavy?'KO':'TKO',M.n);return}
 if(M.heavy&&Math.random()<.3*(1.2-chin/100)*(1-b.mods.taken)){finish(a,'KO',M.n);return}
 b.kd++;FT.rs[idx(a)].kd++;b.state='down';b.t=2.4;b.move=null;b.guard=false;b.hp=b.hpMax*(.28+chin/500);
 msg(b.isP?'다운당했다!':'다운!',1.4,b.isP?'#ff6b6b':'#ffd23c',56);FT.shake=12;FT.hs=.14;gainMom(a,20);
}
function resolveTD(a,b,M){
 const rs=FT.rs[idx(a)];rs.tdA++;
 const av=S(a,'td')*.6+S(a,'wrestle')*.4,dv=S(b,'tdd')*.7+S(b,'wrestle')*.3;
 let c=.38+(av-dv)/110+a.mods.tdPow-b.mods.tddPow+a.planTd+(M.tdBonus||0),timing=false;
 if(['windup','active','recover'].includes(b.state)&&b.move&&MOVES[b.move].type!=='td'){c+=.25;timing=true}
 if(b.st<30)c+=.1;if(a.st<25)c-=.12;if(b.state==='stun')c+=.2;
 if(!techOK(b.stats,b.mods,'tdbasic'))c+=.15;
 if(b.guard){if(techOK(b.stats,b.mods,'sprawl')){c-=.22;fx(b.x,b.y-58,'스프롤','#9fe8ff',16)}else c+=.08}
 if(Math.hypot(b.x-CX,b.y-CY)>180)c+=a.mods.cageTd;
 c=clamp(c,.05,.93);
 if(Math.random()<c){rs.td++;gainMom(a,15);msg(timing?'타이밍 테이크다운!':'테이크다운!',1,a.isP?'#ffd23c':'#8fb6ff',38);enterGround(a,b,M.startPos!=null?M.startPos:M.special?1:0);hurt(b,'ribs',.07);if(M.slam){const sd=M.slam*(1.15-S(b,'chin')/250)*(1-b.mods.taken);b.hp=Math.max(1,b.hp-sd);rs.dmg+=sd;FT.shake=14;FT.hs=.12;fx(b.x,b.y-40,Math.round(sd)+'','#ff6b6b',18);msg('슬램!',1,'#ffd23c',44)}}
 else{
  fx(b.x,b.y-40,'테이크다운 방어','#ffd23c',17);a.state='recover';a.t=.75;a.st=Math.max(0,a.st-6);gainMom(b,8);
  if(!a.isP)FT.ai.tdFails++;
 }
}
function finish(w,method,detail){
 if(FT.over)return;
 FT.over={winner:idx(w),method,detail,round:FT.round,time:fmtT(ROUND_T-FT.time)};
 FT.mg=null;if(FT.ground){FT.ground.prompt=null;FT.ground.pound=null}
 const big=method==='서브미션'?'탭아웃!':method;
 msg(big,2.2,w.isP?'#ffd23c':'#ff6b6b',72);FT.shake=14;
}

/* ========================= 전투: 갱신 ========================= */
function loop(now){
 if(!FT)return;
 const dt=Math.min(.05,(now-FT.lastT)/1000);FT.lastT=now;
 if(!FT.paused&&FT.mode!=='break')update(dt);
 draw();
 if(FT)FT.raf=requestAnimationFrame(loop);
}
function update(dt){
 const [P,A]=FT.F;
 for(const f of FT.fx){f.life-=dt;if(f.dot){f.x+=f.vx*dt;f.y+=f.vy*dt}else f.y-=24*dt}
 FT.fx=FT.fx.filter(f=>f.life>0);
 for(const m of FT.msgs)m.life-=dt;FT.msgs=FT.msgs.filter(m=>m.life>0);
 FT.shake=Math.max(0,FT.shake-30*dt);
 if(FT.intro>0){FT.intro-=dt;if(FT.intro<=0)msg('파이트!',.8,'#ff5566',64);return}
 if(FT.hs>0){FT.hs-=dt;return}
 FT.clock+=dt;
 if(FT.over){FT.overT+=dt;if(FT.overT>2.4&&!FT.resultShown){FT.resultShown=true;finishFight()}return}
 FT.time-=dt;if(FT.time<=0){FT.time=0;endRound();return}
 if(FT.zone){FT.zone.t-=dt;if(FT.zone.t<=0||FT.mode!=='stand'){FT.zone=null;msg('존 종료',.7,'#9fb4c8',24)}}
 const ts=i=>!FT.zone?1:FT.zone.side===i?1.3:.33;
 FT.F.forEach((f,i)=>{const d=dt*ts(i);f.iframe=Math.max(0,f.iframe-d);f.dodgeCd=Math.max(0,f.dodgeCd-d);f.counterWin=Math.max(0,f.counterWin-d);f.flash=Math.max(0,f.flash-dt)});
 if(FT.mode==='stand'){
  playerInputStand(P,dt*ts(0));aiStand(A,P,dt*ts(1));
  for(const f of FT.F){stepFighter(f,dt*ts(idx(f)));if(FT.mode!=='stand'||FT.over)break}
  if(FT.mode==='stand')separate();
 }else if(FT.mode==='ground')updateGround(dt);
 if(FT.mg)updateMG(dt);
}
function moveVec(P){const [x,y]=moveKeys();if(FT.view!=='fp')return [x,y];const c=Math.cos(P.ang),s=Math.sin(P.ang);return [c*(-y)+(-s)*x,s*(-y)+c*x]}
function moveKeys(){return [((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0)]}
function playerInputStand(P,dt){
 const A=FT.F[1];
 if(P.state!=='down'){const ta=Math.atan2(A.y-P.y,A.x-P.x),tr=(P.state==='windup'||P.state==='active'?7:16)*dt;P.ang+=clamp(angN(ta-P.ang),-tr,tr)}
 let [mx,my]=moveVec(P);const n=Math.hypot(mx,my)||1;
 P.mx=mx/n;P.my=my/n;
 P.guard=!!(keys.ShiftLeft||keys.ShiftRight)&&P.state==='idle';
 if(P.buf){P.buf.t-=dt;if(P.buf.t<=0)P.buf=null;else if(P.state==='idle'){const k=P.buf.k;P.buf=null;startMove(P,k)}}
}
function stepFighter(f,dt){
 const o=other(f);
 switch(f.state){
  case 'windup':f.t-=dt;if(f.t<=0){f.state='active';f.t=MOVES[f.move].ac;f.hitDone=false}break;
  case 'active':
   if(MOVES[f.move].lunge){const L=MOVES[f.move];f.x+=Math.cos(f.ang)*L.lunge/L.ac*dt;f.y+=Math.sin(f.ang)*L.lunge/L.ac*dt;clampArena(f)}
   if(!f.hitDone)tryHit(f,o);
   if(f.state!=='active'||FT.mode!=='stand')break;
   f.t-=dt;if(f.t<=0){if(!f.hitDone)f.whiff=true;f.state='recover';f.t=MOVES[f.move].rc*(f.whiff?1.15:1)*(f.st<25?1.2:1)*(f.move==='jab'?1-f.mods.jabSpeed:1)}break;
  case 'recover':f.t-=dt;if(f.t<=0){f.state='idle';f.move=null;f.whiff=false}break;
  case 'dodge':f.t-=dt;f.x+=f.dvx*dt;f.y+=f.dvy*dt;if(f.t<=0)f.state='idle';break;
  case 'down':f.t-=dt;if(f.t<=0){f.state='idle';fx(f.x,f.y-40,'일어났다','#ddd',15)}break;
  case 'stun':f.t-=dt;if(f.t<=0)f.state='idle';break;
 }
 if(FT.mode!=='stand')return;
 if(!['dodge','down','stun'].includes(f.state)){
  const mul={idle:1,windup:.35,active:.35,recover:.55}[f.state]||1,sp=moveSpeed(f)*mul;
  f.x+=f.mx*sp*dt;f.y+=f.my*sp*dt;
 }
 clampArena(f);
 if(f.state==='idle')f.st=Math.min(100,f.st+regen(f)*(f.guard?.35+f.mods.guardRegen:1)*dt);
 else if(f.state==='down')f.st=Math.min(100,f.st+regen(f)*.6*dt);
}
function clampArena(f){const dx=f.x-CX,dy=f.y-CY,d=Math.hypot(dx,dy),R=210;if(d>R){f.x=CX+dx/d*R;f.y=CY+dy/d*R}}
function separate(){
 const [a,b]=FT.F;if(a.state==='down'||b.state==='down')return;
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,min=40;
 if(d<min){const p=(min-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p;clampArena(a);clampArena(b)}
}

/* ========================= 전투: 상대 AI ========================= */
function aiStand(A,P,dt){
 const ai=FT.ai;
 A.mx=A.my=0;
 if(['down','stun','dodge'].includes(A.state)){A.guard=false;return}
 const dx=P.x-A.x,dy=P.y-A.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,ta=Math.atan2(dy,dx);
 const turn=(5+S(A,'spd')/25)*dt*(A.state==='windup'||A.state==='active'?.4:1);
 A.ang+=clamp(angN(ta-A.ang),-turn,turn);
 ai.adaptT-=dt;if(ai.adaptT<=0){ai.adaptT=12;adaptAI(A,P)}
 if(ai.guardT>0){ai.guardT=Math.max(0,ai.guardT-dt);A.guard=A.state==='idle'&&ai.guardT>0}else A.guard=false;
 // 플레이어의 준비 동작에 반응
 if(P.state==='windup'&&P.move&&ai.seen!==P.moveId){
  ai.seen=P.moveId;const M=MOVES[P.move];
  if(d<M.rg*rangeMul(P)+70){
   let ch=.12+(S(A,'judge')+S(A,'focus')+S(A,'evade'))/520+(ai.readType===P.move?.38:0)+A.mods.read-.06*A.inj.cut;
   if(A.st<20)ch*=.6;if(M.special)ch*=.7;
   if(Math.random()<ch){let t=.07+(1-(S(A,'evade')+S(A,'focus'))/200)*.2*(1-A.mods.reflex*.5);if(ai.readType===P.move)t*=.35;ai.react={move:P.move,t}}
  }
 }
 if(ai.react){
  ai.react.t-=dt;
  if(ai.react.t<=0){
   const mv=ai.react.move;ai.react=null;
   if(A.state==='idle'||(A.state==='recover'&&A.t<.12)){
    if(MOVES[mv].type==='td'||(MOVES[mv].heavy&&Math.random()<.55)){
     const s=Math.random()<.5?1:-1;dodge(A,-ux+(-uy)*s*rnd(.2,.8),-uy+ux*s*rnd(.2,.8));
    }else{ai.guardT=.45;A.guard=true;ai.counterReady=Math.random()<.35+A.mods.counter+(A.style==='복서'?.15:0)}
   }
  }
 }
 if(A.state!=='idle')return;
 // 빈틈 응징
 const pr=MOVES.power.rg*rangeMul(A)+P.R-4,facingOk=Math.abs(angN(ta-A.ang))<.4;
 if(P.state==='recover'&&ai.punished!==P.moveId){
  ai.punished=P.moveId;
  const ch=.3+S(A,'judge')/220+(ai.counterReady?.25:0)+A.mods.counter*.5;
  if(d<pr&&facingOk&&Math.random()<ch){ai.guardT=0;A.guard=false;startMove(A,Math.random()<.6?'power':'jab');ai.counterReady=false;return}
 }
 if(A.counterWin>0&&d<pr&&facingOk){startMove(A,'power');return}
 if(A.mom>=100&&P.state!=='down'){const sp=specialFor(A);if(sp){const M=MOVES[sp];const rr=M.type==='zone'?150:M.rg*rangeMul(A)+P.R-4+(M.lunge||0)*.6;if(d<rr&&facingOk&&!(M.type==='zone'&&FT.zone)){startMove(A,sp);return}}}
 // 공격 의도
 ai.cd-=dt;
 if(!ai.intent&&ai.cd<=0&&P.state!=='down')ai.intent=wpick(ai.mix),ai.intentT=1.6;
 let pref=ai.p.pref;
 if(A.st<28)pref+=45;
 if(P.state==='down')pref=120;
 if(ai.intent&&P.state!=='down'){
  ai.intentT-=dt;const M=MOVES[ai.intent],r=M.rg*rangeMul(A)+P.R;pref=r*.8;
  if(d<=r-3&&facingOk&&!ai.guardT){
   if(A.st>M.st*costMul(A)+5)startMove(A,ai.intent);
   ai.intent=null;ai.cd=rnd(.35,1)*(1.5-ai.p.agg)*(A.st<35?1.6:1)*(1.15-S(A,'focus')/400);
  }else if(ai.intentT<=0){ai.intent=null;ai.cd=.3}
 }
 ai.strafeT-=dt;if(ai.strafeT<=0){ai.strafe*=-1;ai.strafeT=rnd(.8,2.4)}
 const rad=clamp((d-pref)/40,-1,1);let mx=ux*rad-uy*ai.strafe*.55,my=uy*rad+ux*ai.strafe*.55;
 const cx=A.x-CX,cy=A.y-CY,cr=Math.hypot(cx,cy);if(cr>175){mx-=cx/cr*(cr-175)/35;my-=cy/cr*(cr-175)/35}
 const n=Math.hypot(mx,my);if(n>1){mx/=n;my/=n}
 A.mx=mx;A.my=my;
}
function adaptAI(A,P){
 const ai=FT.ai,mix=ai.mix,all=[FT.rs,...FT.rounds];
 let dealt=0,taken=0;for(const r of all){dealt+=r[1].dmg;taken+=r[0].dmg}
 const adaptive=A.style==='올라운더'?1:.5;
 if(Math.random()>adaptive)return;
 let changed=false;
 if(dealt>taken*1.3+5){mix.td*=1.35;changed=true}
 if(ai.tdFails>=2){mix.td*=.6;ai.tdFails=0;mix.power*=1.15;changed=true}
 if(S(P,'tdd')<S(A,'td')-10)mix.td*=1.1;
 if(S(P,'sdef')<S(A,'acc')-10)mix.power*=1.1;
 if(S(P,'chin')<45)mix.power*=1.1;
 mix.td=clamp(mix.td,.03,.65);
 const s=mix.jab+mix.power+mix.kick+mix.td;for(const k in mix)mix[k]/=s;
 if(changed&&A.style==='올라운더')msg('상대가 전략을 바꿨다',1.4,'#8fb6ff',24);
}

 B.x-=45;T.x+=45;if(B.x>T.x){const t=B.x;B.x=T.x;T.x=t}

function passVals(atk,def){return [(S(atk,'wrestle')*.5+S(atk,'bjj')*.5)*(1+atk.mods.groundPow),S(def,'bjj')*.7+S(def,'wrestle')*.3]}
function escVals(bot,top){return [S(bot,'wrestle')*.5+S(bot,'bjj')*.3+S(bot,'spd')*.2,(S(top,'wrestle')*.6+S(top,'bjj')*.4)*(1+top.mods.groundPow)]}
function subVals(atk,def){return [(S(atk,'subatk')*.6+S(atk,'bjj')*.4)*(1+atk.mods.subPow)-5*atk.inj.arm,(S(def,'subdef')*.6+S(def,'bjj')*.4)*(1+def.mods.subDef)]}
function poundHit(a,b,heavy){
 const g=FT.ground,pm=[.55,.75,.95,1.25][g.pos],rs=FT.rs[idx(a)];
 let dmg=(heavy?8:4.5)*pm*(.55+S(a,'punch')/110)*(1+a.mods.groundPow+a.mods.dmg+a.mods.gnp)*(a.st<25?.75:1)*rnd(.9,1.1)*(1.15-S(b,'chin')/250)*(1-b.mods.taken)*.8;
 const blocked=b.isP?!!(keys.ShiftLeft||keys.ShiftRight):Math.random()<(.55-g.pos*.1+S(b,'sdef')/400)*(b.st>15?1:.4);
 if(blocked){dmg*=.35;b.st=Math.max(0,b.st-2);fx(b.x,b.y-34,'블록','#aaa',14)}
 else{rs.landed++;g.idle=0;spark(b.x,b.y,'#ffb347');FT.shake=Math.max(FT.shake,heavy?5:2)}
 rs.thrown++;rs.dmg+=dmg;b.hp-=dmg;b.flash=.12;
 fx(b.x+rnd(-8,8),b.y-22,Math.round(dmg)+'',blocked?'#888':'#ff6b6b',14);
 gainMom(a,blocked?1:4);
 if(!blocked&&heavy)hurt(b,'cut',dmg/100);
 if(b.hp<=0)finish(a,'TKO','파운딩');
}
function updateGround(dt){
 const g=FT.ground,A=FT.F[1],P=FT.F[0];
 FT.rs[g.top].ctrl+=dt;g.idle+=dt;g.cd=Math.max(0,g.cd-dt);
 if(!FT.mg)for(const f of FT.F)f.st=Math.min(100,f.st+regen(f)*.45*dt);
 const T=FT.F[g.top],B=FT.F[1-g.top];T.ang=Math.atan2(B.y-T.y,B.x-T.x)||T.ang;
 if(g.prompt){g.prompt.t-=dt;if(g.prompt.t<=0)resolvePrompt()}
 if(g.pound){g.pound.t-=dt;if(g.pound.t<=0){const h=g.pound.heavy;g.pound=null;poundHit(A,P,h)}}
 if(FT.over||FT.mg||FT.mode!=='ground')return;
 if(g.idle>14){standUp('심판이 스탠드업을 지시했다');return}
 g.aiT-=dt;
 if(g.aiT<=0&&!g.prompt&&!g.pound){g.aiT=rnd(1.1,2)*(1.3-S(A,'judge')/250);aiGroundAct()}
}
function subAttempt(att,def,fromTop){
 const g=FT.ground,isP=att.isP;
 const list=subsFor(att.stats,att.mods,fromTop,g.pos);
 if(!list.length){if(isP)fx(att.x,att.y-40,'이 자세에서 쓸 줄 아는 서브미션이 없다','#aaa',15);return false}
 const s=list[Math.floor(Math.pow(Math.random(),.6)*list.length)];
 let [av,dv]=subVals(att,def);av+=s.lv*3+(fromTop?[-8,0,6,12][g.pos]:-8);
 att.st=Math.max(0,att.st-8*costMul(att));FT.rs[idx(att)].subA++;g.idle=0;
 const know=subKnow(def.stats,def.mods,s);
 if(isP){
  msg(`${s.n} 시도 (Lv${s.lv})`,1,'#ffd23c',30);
  if(know===0)fx(def.x,def.y-58,'상대가 방어법을 모른다','#ffd23c',16);
  startMG({kind:'struggle',role:'atk',label:`${s.n} Lv${s.lv}${know===0?' — 상대는 방어법을 모른다':know===2?' — 상대가 이 기술을 잘 안다':''}`,pv:av,av:dv,know,start:att.mods.subStart,
   onEnd:(ok,x,m)=>{if(ok)finish(att,'서브미션',s.n);else if(FT.ground){if(fromTop)g.pos=Math.max(0,g.pos-1);fx(def.x,def.y-40,'탈출','#8fb6ff',18);if(s.arm&&m.peak>=70)hurt(def,'arm',.7);if(s.leg&&m.peak>=70)hurt(def,'leg',.7)}}});
 }else{
  msg(`상대의 ${s.n}! (Lv${s.lv})`,1,'#ff6b6b',30);
  startMG({kind:'struggle',role:'def',label:`${s.n} 방어${know===0?' — 방어법을 모른다!':know===2?' — 잘 아는 기술':''}`,pv:dv,av,know,start:att.mods.subStart,
   onEnd:(ok,x,m)=>{if(!ok)finish(att,'서브미션',s.n);else{fx(def.x,def.y-40,'빠져나왔다!','#9fe8ff',18);gainMom(def,10);if(s.arm&&m.peak>=70)hurt(def,'arm',.7);if(s.leg&&m.peak>=70)hurt(def,'leg',.7)}}});
 }
 return true;
}
function groundPlayerAction(act){
 if(FT.mode!=='ground'||FT.mg||FT.over)return;
 const g=FT.ground,P=FT.F[0],A=FT.F[1],top=g.top===0;
 if(act==='jab'||act==='power'){
  if(g.cd>0)return;
  if(!top&&act==='power')return;
  const heavy=act==='power',cost=(top?(heavy?9:5):4)*costMul(P);
  if(P.st<cost*.5){fx(P.x,P.y-40,'스태미나 부족','#aaa',15);return}
  P.st=Math.max(0,P.st-cost);g.cd=top?(heavy?.85:.45):.6;P.gAnim=.22;P.gHeavy=heavy;
  if(top)poundHit(P,A,heavy);
  else{const rs=FT.rs[0];rs.thrown++;const dmg=2.4*(.55+S(P,'punch')/110)*rnd(.9,1.1);if(Math.random()<.6){A.hp=Math.max(1,A.hp-dmg);rs.landed++;rs.dmg+=dmg;fx(A.x,A.y-30,Math.round(dmg)+'','#ff6b6b',13)}else fx(A.x,A.y-30,'빗나감','#888',13)}
  return;
 }
 if(top){
  if(act==='space'){standUp('일어서서 스탠딩으로 돌아갔다');return}
  if(act==='q'){
   if(g.pos>=3){fx(P.x,P.y-40,'이미 마운트','#aaa',15);return}
   if(g.pos===2&&!techOK(P.stats,P.mods,'mount')){fx(P.x,P.y-40,'마운트 진입 기술이 없다 (주짓수 '+(TECHM.mount.req.bjj-P.mods.techReq)+' 필요)','#ffb347',15);return}
   const [pv,av]=passVals(P,A);P.st=Math.max(0,P.st-5*costMul(P));
   startMG({kind:'timing',role:'atk',label:'가드 패스 → '+POSN[g.pos+1],pv,av,onEnd:ok=>{if(!FT.ground)return;if(ok){g.pos++;g.idle=0;gainMom(P,8);msg(POSN[g.pos],1,'#ffd23c',32)}else{fx(P.x,P.y-40,'패스 실패','#aaa',16);P.st=Math.max(0,P.st-5)}}});
   return;
  }
  if(act==='e')subAttempt(P,A,true);
 }else{
  if(act==='space'){
   const [pv,av]=escVals(P,A);P.st=Math.max(0,P.st-6*costMul(P));
   const pinned=g.pos>=2,shrimp=techOK(P.stats,P.mods,'shrimp');
   startMG({kind:'timing',role:'atk',label:pinned&&!shrimp?'탈출 — 새우빼기를 몰라서 몸이 빠지지 않는다':'탈출',pv,av:av+g.pos*8,esc:1,zoneMul:pinned&&!shrimp?.35:1,onEnd:(ok,perfect)=>{if(!FT.ground)return;
    if(ok){if(perfect&&g.pos<=1&&techOK(P.stats,P.mods,'sweep')){g.top=0;g.pos=0;g.idle=0;msg('스윕!',1.1,'#ffd23c',40);gainMom(P,15)}else standUp('탈출해서 일어났다')}else fx(P.x,P.y-40,'탈출 실패','#aaa',16)}});
   return;
  }
  if(act==='e'){
   if(g.pos>1){fx(P.x,P.y-40,'이 자세에서는 서브미션을 걸 수 없다','#aaa',15);return}
   subAttempt(P,A,false);
  }
 }
}
function aiGroundAct(){
 const g=FT.ground,A=FT.F[1],P=FT.F[0];
 const grap=A.style==='레슬러'||A.style==='주짓수',bjjy=A.style==='주짓수'||S(A,'bjj')>55;

 if(g.top===1){

  const w={pound:.45,pass:canPass?.25*(grap?1.4:1):0,sub:canSub&&g.pos>=1?.15*(bjjy?1.8:.6):0,stand:grap?.03:(A.hp>P.hp?.18:.06)};
  const c=wpick(w);
  if(c==='pound'){g.pound={t:.38*(1+P.mods.read),heavy:Math.random()<.3};A.st=Math.max(0,A.st-4*costMul(A))}
  else if(c==='pass'){const t=.6*(1+P.mods.reflex*.5);g.prompt={type:'pass',t,max:t,ok:false}}

 }else{

  if(c==='esc'){const t=.55*(1+P.mods.reflex*.5)*(techOK(P.stats,P.mods,'posture')?1.4:1);g.prompt={type:'escape',t,max:t,ok:false}}
  else if(c==='sub')subAttempt(A,P,false);
 }

function resolvePrompt(){

 if(p.ok){gainMom(P,6);return}
 if(p.type==='pass'){const [av,dv]=passVals(A,P);if(Math.random()<.55+(av-dv)/100){g.pos=Math.min(3,g.pos+1);msg('상대: '+POSN[g.pos],1,'#8fb6ff',28)}else fx(A.x,A.y-40,'패스 실패','#aaa',15)}

function startMG(o){

 let zw=clamp(.13+diff/350+P.mods.zone+(o.esc?P.mods.escape:0),.06,.34)*(.6+.4*P.st/100)*(o.zoneMul||1);
 let aiRate=clamp(9-diff*.22,4,22),meter=o.kind==='struggle'?(o.role==='atk'?40:45):0;

  meter+=(o.start||0)*(o.role==='atk'?1:1);

  else{if(o.know===0)aiRate*=.55;else if(o.know===2)aiRate*=1.25}
 }
 zw=Math.max(.035,zw);
 FT.mg={...o,cur:0,dir:1,speed:clamp(1.15-diff/150,.7,2),zc:rnd(.1+zw/2,.9-zw/2),zw,peak:0,meter,t:o.kind==='timing'?2.6:7,max:o.kind==='timing'?2.6:7,aiRate};
}
function updateMG(dt){
 const m=FT.mg;m.cur+=m.dir*m.speed*dt;if(m.cur>1){m.cur=1;m.dir=-1}if(m.cur<0){m.cur=0;m.dir=1}

 if(hit){m.zc=rnd(.1+m.zw/2,.9-m.zw/2);m.flash=.15}

function endRound(){
 FT.mg=null;FT.rounds.push(FT.rs);
 const docs=[];
 if(FT.round<ROUNDS)for(const f of FT.F){
  const who=f.isP?'당신':'상대';

  if(f.inj.cut>=2)docs.push(`닥터가 ${who}의 출혈을 확인했다. 경기 속행.`);
 }
 if(FT.round>=ROUNDS){decision();return}
 FT.mode='break';
 const [P,A]=FT.F,rs=FT.rs,ai=FT.ai,tips=[];
 if(P.st<35)tips.push('스태미나가 바닥이다. 무리한 연타 대신 잽과 회피로 숨을 골라라.');
 if(ai.readType)tips.push(`상대가 당신의 ${MOVES[ai.readType].n}을(를) 읽고 있다. 공격을 섞어라.`);
 if(rs[0].tdA>=2&&rs[0].td===0)tips.push('테이크다운이 막히고 있다. 상대가 공격하는 순간에 들어가라.');
 if(rs[1].kickL>=3)tips.push('킥을 많이 맞았다. 킥 준비 동작(주황색)이 보이면 거리를 벌리거나 파고들어라.');
 if(rs[1].td>=1)tips.push('노란색 준비 동작은 테이크다운이다. Space로 피하면 된다.');
 if(!tips.length)tips.push('좋은 흐름이다. 지금처럼 거리를 지키며 빈틈을 노려라.');
 const injTxt=f=>Object.keys(INJT).filter(k=>f.inj[k]).map(k=>`${INJLV[f.inj[k]]} ${INJT[k].n}`).join(', ')||'없음';
 if(Object.values(P.inj).some(v=>v))tips.unshift(`부상(${injTxt(P)}) 때문에 불리하다. ${P.inj.ribs?'갈비뼈 때문에 스태미나가 빨리 닳는다. ':''}${P.inj.leg?'다리 때문에 느려졌다. 거리를 너무 벌리지 마라. ':''}${P.inj.cut?'출혈이 심해지면 닥터가 경기를 멈춘다. 머리를 지켜라.':''}`);
 showOverlay(`<h2>${FT.round}라운드 종료</h2>${statTable(rs)}
  <p class="small" style="margin:6px 0;color:#bbb">부상 — 나: ${injTxt(P)} / 상대: ${injTxt(A)}</p>
  ${docs.map(d=>`<p class="doc">${d}</p>`).join('')}

  <button class="btn" id="nrBtn" style="width:100%"><kbd>Enter</kbd> ${FT.round+1}라운드 시작</button>`);
 $('#nrBtn').onclick=nextRound;

    else if(mv.type==='kick'){if(f.move==='sp_knee'&&st==='active'){hipY=1.25;kR=V3(reach-.15,1.15,.05);fR=V3(reach-.45,.8,.05);lean=.15}
     else if(st==='active'){fR=V3(reach-.1,f.move==='sp_kick'?1.5:1.05,.02);kR=V3(reach*.5,.95,.1);lean=-.12}else{kR=V3(.2,.62+.15*pr,.16);fR=V3(.02,.35*pr,.2)}}
    else if(mv.type==='td'){hipY=st==='active'?.6:.95-.2*pr;lean=st==='active'?.45:.25*pr;gl=V3(.5+(st==='active'?.25:0),.85,-.17);gr=V3(.5+(st==='active'?.25:0),.85,.17)}
   }
   if(f.guard){gl=V3(.22,1.56,-.07);gr=V3(.2,1.57,.07)}
   if(st==='stun')lean=Math.sin(t*14)*.08;
  }
  hip=V3(0,hipY+bob,0);neck=V3(lean*.9,hipY+.5+bob-Math.max(0,lean)*.15,twist);head=V3(neck.x+.03,neck.y+.17,twist);
  const dy=hipY-.95+bob;if(mode!=='mounted'){gl.y+=dy*.8;gr.y+=dy*.8}
  sL=V3(neck.x,neck.y-.05,-.2*bk+twist);sR=V3(neck.x,neck.y-.05,.2*bk+twist);
  hL=V3(0,hipY-.04+bob,-.1);hR=V3(0,hipY-.04+bob,.1);
  if(mode!=='mounted')kL.y=Math.min(kL.y,hipY*.55);
 }
 // 몸통
 const up=new T.Vector3(0,1,0),tdir=new T.Vector3().subVectors(neck,hip).normalize(),q=new T.Quaternion().setFromUnitVectors(up,tdir);
 const at=k=>hip.clone().lerp(neck,k);
 placeS(P.pelvis,at(-.02),.13*bk,.11,.165*bk,q);
 placeS(P.abs,at(.32),.115*bk,.16,.145*bk,q);
 placeS(P.lat,at(.6),.12*bk,.17,.19*bk,q);
 placeS(P.chest,at(.72),.13*bk,.14,.2*bk,q);
 const fwd=new T.Vector3(1,0,0).applyQuaternion(q),side=new T.Vector3(0,0,1).applyQuaternion(q);
 for(const [m,s] of [[P.pecL,-1],[P.pecR,1]])placeS(m,at(.74).addScaledVector(fwd,.07*bk).addScaledVector(side,s*.07*bk).addScaledVector(tdir,.02),.045*bk,.06,.07*bk,q);
 placeS(P.trap,at(.94),.08*bk,.045,.13*bk,q);
 placeS(P.delL,sL,.066*bk,.07*bk,.066*bk);placeS(P.delR,sR,.066*bk,.07*bk,.066*bk);
 setSeg(P.neck,at(.92),head.clone().addScaledVector(tdir,-.06),1);
 P.head.position.copy(head);P.head.quaternion.copy(q);if(headRotZ){P.head.rotation.set(0,0,headRotZ)}
 // 팔
 const elb=(s,g,sd)=>{const e=s.clone().lerp(g,.5);const d=s.distanceTo(g);e.y-=Math.max(0,.22-d*.25);e.z+=sd*.07;return e};
 for(const [s,sh,gp,sd] of [['L',sL,gl,-1],['R',sR,gr,1]]){
  const e=mode==='lying'?sh.clone().lerp(gp,.5).add(V3(.06,.1,sd*.04)):elb(sh,gp,sd),dir=new T.Vector3().subVectors(gp,e).normalize(),wr=gp.clone().addScaledVector(dir,-.07);
  setSeg(P['u'+s],sh,e,1);placeS(P['e'+s],e,.043*bk,.043*bk,.043*bk);setSeg(P['f'+s],e,wr,1);
  setSeg(P['b'+s],wr.clone().addScaledVector(dir,-.03),wr,1);
  P['g'+s].position.copy(gp);P['g'+s].scale.set(.05,.065,.047);P['g'+s].quaternion.setFromUnitVectors(up,dir);
 }
 // 다리
 for(const [s,h,k,ft] of [['L',hL,kL,fL],['R',hR,kR,fR]]){
  setSeg(P['sh'+s],h.clone().add(V3(0,.04,0)),h.clone().lerp(k,.6),1);setSeg(P['t'+s],h,k,1);placeS(P['k'+s],k,.055*bk,.055*bk,.055*bk);
  const ank=ft.clone().add(V3(0,.07,0));setSeg(P['s'+s],k,ank,1);
  const fd=mode==='lying'?V3(0,1,0):new T.Vector3().subVectors(ank,k).setY(0);if(fd.lengthSq()<.0001)fd.set(1,0,0);fd.normalize();
  if(mode!=='lying'&&Math.abs(ank.y-.07)<.05)fd.set(1,0,s==='L'?-.15:.25).normalize();
  P['ft'+s].position.copy(ank).addScaledVector(fd,.05).add(V3(0,-.035,0));P['ft'+s].scale.set(.1,.033,.045);
  P['ft'+s].quaternion.setFromUnitVectors(new T.Vector3(1,0,0),fd);
 }
}
function renderFP(){
 const H=TH,T=H.T,[P,A]=FT.F,M=H.opp;
 const p=w2t(P.x,P.y),a=w2t(A.x,A.y);
 let mode='stand';
 // 상대 텔레그래프 색
 const em=(mat,col,k)=>{mat.emissive.set(col);mat.emissiveIntensity=k};
 em(M.mats.gL,0x000000,0);em(M.mats.gR,0x000000,0);em(M.mats.legM,0x000000,0);
 if(A.state==='windup'&&A.move){const mv=MOVES[A.move],k=clamp(1-A.t/Math.max(.01,windupT(A,mv)),0,1)*.9+.2,col=new T.Color(mv.col);
  if(A.move==='jab')em(M.mats.gL,col,k);else if(mv.type==='punch')em(M.mats.gR,col,k);else if(mv.type==='kick')em(M.mats.legM,col,k);else{em(M.mats.gL,col,k);em(M.mats.gR,col,k)}}
 const flashK=A.flash>0?A.flash*5:0;M.mats.skin.emissive.set(0xffffff);M.mats.skin.emissiveIntensity=flashK;
 const ang=FT.mode==='ground'?FT.gAng:P.ang,fx_=Math.cos(ang),fz=Math.sin(ang);
 let eye=H.eye,look=H.look;
 if(FT.mode==='ground'&&FT.ground){
  const top=FT.ground.top===0;
  if(top){eye.set(p[0]-fx_*.35,1.38,p[1]-fz*.35);M.g.position.set(p[0]+fx_*.1,0,p[1]+fz*.1);M.g.rotation.y=-(ang+Math.PI);poseModel(M,A,'lying');look.set(p[0]+fx_*.8,.1,p[1]+fz*.8)}
  else{eye.set(p[0]-fx_*.45,.4,p[1]-fz*.45);M.g.position.set(p[0]+fx_*.45,0,p[1]+fz*.45);M.g.rotation.y=-(ang+Math.PI);poseModel(M,A,'mounted');look.set(p[0]+fx_*.5,.82,p[1]+fz*.5)}
 }else{
  A.visReach=Math.hypot(a[0]-p[0],a[1]-p[1])-.42;M.g.position.set(a[0],0,a[1]);M.g.rotation.y=-A.ang;
  poseModel(M,A,A.state==='down'?'lying':'stand');
  if(A.state==='down'){M.g.rotation.y=-A.ang+Math.PI}
  let ey=1.62;if(P.state==='down')ey=.42;if(P.move==='td'&&(P.state==='active'||P.state==='windup'))ey=1.25;if(P.state==='stun')ey=1.55;
  const moving=Math.hypot(P.mx,P.my)>.1&&P.state!=='down';
  eye.set(p[0],ey+(moving?Math.sin(FT.clock*11)*.02:0),p[1]);
  const lookY=A.state==='down'?.3:1.42;
  look.set(a[0],lookY,a[1]);
  if(P.state==='down')look.set(p[0]+fx_*2,1.8,p[1]+fz*2);
 }
 H.cam.position.copy(eye);
 if(FT.shake>0&&FT.shakeOn)H.cam.position.add(new T.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(FT.shake*.004));
 H.cam.lookAt(look);
 if(P.state==='stun')H.cam.rotation.z+=Math.sin(FT.clock*12)*.05;
 if(P.state==='dodge')H.cam.rotation.z+=.05;
 // 내 팔
 const vL=V3(-.24,-.21,-.46),vR=V3(.24,-.23,-.43);let legOn=false,legTo=null;
 const mv=P.move?MOVES[P.move]:null;
 if(FT.mode==='ground'&&FT.ground){
  if(FT.ground.top===0){vL.set(-.18,-.22,-.38);vR.set(.18,-.22,-.38);if(P.gAnim>0){(P.gHeavy?vR:vR).set(.05,-.38,-.7)}}
  else{vL.set(-.12,-.06,-.3);vR.set(.12,-.06,-.3);if(keys.ShiftLeft||keys.ShiftRight){vL.set(-.07,-.02,-.22);vR.set(.07,-.02,-.22)}}
 }else{
  if(P.guard){vL.set(-.09,-.06,-.26);vR.set(.09,-.06,-.26)}
  if(mv&&(P.state==='windup'||P.state==='active')){
   const act=P.state==='active';
   if(P.move==='jab'){if(act)vL.set(-.05,-.04,-.95);else vL.set(-.22,-.15,-.34)}
   else if(mv.type==='punch'){if(act)vR.set(.02,-.03,-1.0);else vR.set(.28,-.24,-.24)}
   else if(mv.type==='kick'){legOn=true;legTo=act?V3(.02,-.15,-1.1):V3(.25,-.7,-.5)}
   else if(mv.type==='td'){vL.set(-.22,-.3,-.75);vR.set(.22,-.3,-.75)}
  }
 }
 if(P.gAnim>0)P.gAnim-=1/60;
 H.cur.l.lerp(vL,.45);H.cur.r.lerp(vR,.45);
 for(const [g,a,bd,c,sd] of [[H.gl,H.al,H.bl,H.cur.l,-1],[H.gr,H.ar,H.br,H.cur.r,1]]){
  const el=V3(c.x+sd*.14,-.6,-.02),dir=new T.Vector3().subVectors(c,el).normalize(),wr=c.clone().addScaledVector(dir,-.06);
  setSeg(a,el,wr,1);setSeg(bd,wr.clone().addScaledVector(dir,-.035),wr,1);
  g.position.copy(c);g.scale.set(.046,.04,.06);g.quaternion.setFromUnitVectors(new T.Vector3(0,0,-1),dir);
 }
 H.leg.visible=legOn;if(legOn)setSeg(H.leg,V3(.2,-1.1,-.2),legTo,1);
 // 관중 플래시
 for(const s of H.flashes){if(s.material.opacity>0)s.material.opacity=Math.max(0,s.material.opacity-.12);else if(Math.random()<.02){const a2=Math.random()*Math.PI*2,h=1.5+Math.random()*5;s.position.set(Math.cos(a2)*11.5,h,Math.sin(a2)*11.5);s.material.opacity=1}}
 H.r.render(H.scene,H.cam);
}
function w2t(x,y){return [(x-CX)*SC,(y-CY)*SC]}
function proj(x,y,h){const H=TH,v=H.tmp;const p=w2t(x,y);v.set(p[0],h,p[1]).project(H.cam);if(v.z>1||v.z<-1)return null;return [(v.x+1)/2*960,(1-v.y)/2*600]}
function drawFPMarks(){
 const c=ctx,[P,A]=FT.F;
 // 상대 준비 동작 링
 if(A.state==='windup'&&A.move&&FT.mode==='stand'){const mv=MOVES[A.move],s=proj(A.x,A.y,1.2);
  if(s){const pr=clamp(1-A.t/Math.max(.01,windupT(A,mv)),0,1);c.strokeStyle=mv.col;c.lineWidth=5;c.globalAlpha=.9;c.beginPath();c.arc(s[0],s[1],70,-Math.PI/2,-Math.PI/2+Math.PI*2*pr);c.stroke();c.globalAlpha=1;
   if(P.mods.read>0){c.font='700 16px "Noto Sans KR",sans-serif';c.fillStyle=mv.col;c.textAlign='center';c.fillText(mv.n,s[0],s[1]-82)}}}
 for(const f of FT.fx){const s=proj(f.x,f.y,1.75+(1-f.life)*.3);if(!s)continue;
  c.globalAlpha=clamp(f.life*1.5,0,1);
  if(f.dot){c.fillStyle=f.c;c.beginPath();c.arc(s[0],s[1],3,0,7);c.fill()}
  else{c.font=`800 ${f.s+4}px "Barlow Condensed","Noto Sans KR",sans-serif`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.75)';c.strokeText(f.t,s[0],s[1]);c.fillStyle=f.c;c.fillText(f.t,s[0],s[1])}}
 c.globalAlpha=1;
 if(FT.mode==='stand'){const d=Math.hypot(A.x-P.x,A.y-P.y);
  const items=[['잽','jab'],['스트레이트','power'],['킥','kick'],['태클','td']].map(([n,k])=>[n,d<=MOVES[k].rg*rangeMul(P)+A.R]);
  c.font='700 13px "Noto Sans KR",sans-serif';c.textAlign='center';let x=480-items.length*42;
  rrect(x-8,530,items.length*84+16,30,15);c.fillStyle='rgba(8,10,14,.7)';c.fill();
  for(const [n,ok] of items){c.fillStyle=ok?'#7dffa0':'#68707e';c.fillText((ok?'● ':'○ ')+n,x+42,550);x+=84}}
}
function drawMiniMap(){
 const c=ctx,[P,A]=FT.F,cx=74,cy=500,k=.22;
 c.save();c.globalAlpha=.92;
 c.beginPath();for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4,x=cx+Math.cos(a)*246*k,y=cy+Math.sin(a)*246*k;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();
 c.fillStyle='rgba(10,12,16,.75)';c.fill();c.strokeStyle='#4a5366';c.lineWidth=2;c.stroke();
 const pt=f=>[cx+(f.x-CX)*k,cy+(f.y-CY)*k];

 c.strokeStyle='rgba(125,255,160,.35)';c.lineWidth=1;c.beginPath();c.arc(px,py,(MOVES.kick.rg*rangeMul(P)+20)*k,0,7);c.stroke();
 c.beginPath();c.arc(px,py,(MOVES.jab.rg*rangeMul(P)+20)*k,0,7);c.stroke();
 for(const [x,y,f,col] of [[px,py,P,'#ff4d5e'],[ax,ay,A,'#5b8cff']]){c.fillStyle=col;c.beginPath();c.arc(x,y,4.5,0,7);c.fill();c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(f.ang)*10,y+Math.sin(f.ang)*10);c.stroke()}

/* ========================= 경기 종료 처리 ========================= */
function finishFight(){
 cancelAnimationFrame(FT.raf);
 const f=G.f,o=f.opp,res=FT.over,win=res.winner===0,draw=res.winner===-1,[PF,AF]=FT.F;
 if(!FT.rounds.includes(FT.rs))FT.rounds.push(FT.rs);
 const tot=[newRS(),newRS()];for(const r of FT.rounds)for(let i=0;i<2;i++)for(const k in tot[i])tot[i][k]+=r[i][k];
 const rec=f.record,notes=[];
 if(draw)rec.d++;else if(win){rec.w++;if(res.method==='KO'||res.method==='TKO')rec.ko++;else if(res.method==='서브미션')rec.sub++;else rec.dec++}else rec.l++;
 f.history.unshift({res:draw?'무':win?'승':'패',opp:o.name,oppOvr:ovr(o),method:res.method,detail:res.method==='TKO'||res.method==='KO'||res.method==='서브미션'?res.detail:'',round:res.round,time:res.time,tier:TIERS[f.tier].n,week:f.week});
 const famePlus=draw?2:win?(8+f.tier*6)*(res.method.includes('판정')?1:1.4)*(1+calcMods(f).fame):-3;
 f.fame=Math.max(0,f.fame+famePlus);
 if(win&&f.tier<3){f.tierWins++;if(f.tierWins>=TIERS[f.tier].need){f.tier++;f.tierWins=0;notes.push({t:`승급! 이제 ${TIERS[f.tier].n}에서 싸운다.`,big:1});if(f.tier===3)notes.push({t:'UFC 입성. 랭킹과 타이틀전은 다음 단계에서 추가됩니다.'})}}
 if(!win&&!draw&&f.tier<3&&f.tierWins>0){f.tierWins--;notes.push({t:'패배로 승급 진행도가 1 줄었다.',bad:1})}
 const P=tot[0],xm=win?1.3:1,ups={};
 const ex=(k,a)=>{const g=addStat(f,k,a*xm);if(g>.05)ups[k]=(ups[k]||0)+g};
 ex('acc',Math.min(1.5,P.landed*.04));ex('sspeed',Math.min(1,P.thrown*.015));ex('kick',Math.min(1.2,P.kickL*.15));
 ex('td',Math.min(1.5,P.td*.5+P.tdA*.15));ex('wrestle',Math.min(1,P.td*.35+P.ctrl*.01));ex('bjj',Math.min(1.2,P.subA*.35+P.ctrl*.008));ex('subatk',Math.min(1,P.subA*.4));
 ex('chin',Math.min(1,tot[1].dmg*.008));ex('calm',.4);ex('focus',.3);ex('judge',.4);ex('endur',.3);
 f.fatigue=clamp(f.fatigue+22,0,100);
 // 경기 중 부상 → 회복 기간
 const pin=PF.inj,sum=pin.cut+pin.ribs+pin.leg+pin.arm;
 if(sum>0){
  const worst=Object.keys(pin).sort((a,b)=>pin[b]-pin[a])[0],w=sum+(pin[worst]>=3?1:0);
  const j=injureNamed(f,INJT[worst].after,w);notes.push({t:`경기 부상: ${j.name} 진단, ${w}주 회복 필요`,bad:1});
 }else if(Math.random()<tot[1].dmg/450){const j=injure(f,1);notes.push({t:`경기 후 통증: ${j.name} (${j.weeks}주)`,bad:1})}
 const disc=tryDiscover(f,.18);if(disc)notes.push({t:`숨겨진 재능 발견! [${GR[disc.g].n}] ${TAL[disc.id].n}`,big:1});
 const injList=x=>Object.keys(INJT).filter(k=>x.inj[k]>0).map(k=>`${INJLV[x.inj[k]]} ${INJT[k].n}`);
 const fightInj=[injList(PF),injList(AF)];
 f.nextFightIn=ri(4,6);f.opp=genOpp(f.tier,f.wc);
 f.log.unshift({w:f.week,t:`${draw?'무승부':win?'승리':'패배'} — ${o.name}, ${res.method}${res.round?' '+res.round+'R':''}. 다음 경기는 ${f.nextFightIn}주 뒤, 상대는 ${f.opp.name}.`});
 save();
 FT=null;cv=null;ctx=null;disposeTH();for(const k in keys)keys[k]=false;
 renderResult({res,win,draw,tot,ups,notes,famePlus,opp:o,fightInj});
}
